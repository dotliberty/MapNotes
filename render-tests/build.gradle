plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.23'
}

// Keep the historical standalone invocation working as well as the root build.
def sourceRoot = projectDir.parentFile
def originalManifest = new XmlParser(false, false).parse(new File(sourceRoot, 'AndroidManifest.xml'))
def manifestVersion = originalManifest.attribute('android:versionName')
def manifestCode = originalManifest.attribute('android:versionCode').toInteger()
def manifestTarget = originalManifest.'uses-sdk'[0].attribute('android:targetSdkVersion').toInteger()
def generatedManifest = layout.buildDirectory.file('generated/mapnotes/AndroidManifest.xml').get().asFile
// AGP owns namespace/applicationId; never edit the authored manifest or keys.
originalManifest.attributes().remove('package')
generatedManifest.parentFile.mkdirs()
generatedManifest.text = groovy.xml.XmlUtil.serialize(originalManifest)
def debugManifest = layout.buildDirectory.file('generated/mapnotes/debug/AndroidManifest.xml').get().asFile
debugManifest.parentFile.mkdirs()
debugManifest.text = '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">' +
    '<application android:label="MapNotes beta DEBUG" tools:replace="android:label" />' +
    '</manifest>'
def benchmarkManifest = layout.buildDirectory.file('generated/mapnotes/benchmark/AndroidManifest.xml').get().asFile
benchmarkManifest.parentFile.mkdirs()
benchmarkManifest.text = '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">' +
    '<application android:label="MapNotes beta TEST" tools:replace="android:label" />' +
    '</manifest>'

android {
    namespace 'ru.main.explorer'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.main.explorer'
        minSdk 26
        targetSdk manifestTarget
        versionName manifestVersion
        versionCode manifestCode
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig null
        }
        release {
            signingConfig null
            minifyEnabled false
        }
        benchmark {
            initWith release
            applicationIdSuffix '.debug'
            debuggable false
            signingConfig null
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        debug {
            manifest.srcFile debugManifest
        }
        benchmark {
            manifest.srcFile benchmarkManifest
        }
        main {
            manifest.srcFile generatedManifest
            java.srcDirs = ['../src']
            assets.srcDirs = ['../assets']
            res.srcDirs = ['../res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
    // Optional runtime recognition signal; recording must also work without Google services.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.withType(Test).configureEach {
    // Robolectric's real ParcelFileDescriptor close path reflects FileDescriptor on JDK 21.
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    maxHeapSize = '2g'
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
